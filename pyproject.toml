[project]
name = "ughost"
version = "1.1.1"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "iamraw>=4.95.0,<5.0.0",
    "pdflog>=1.0.2,<2.0.0",
    "pillow>=12.3.0,<13.0.0",
    "utilo>=2.110.1,<3.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "hoverpower>=1.6.1,<2.0.0",
    "upainter>=1.0.0,<2.0.0",
    "utilotest>=1.0.5,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/ughost"
Repository = "https://github.com/anaticulae/ughost"

[project.scripts]
ughost = "ughost.cli:main"

[build-system]
requires = [
    "setuptools>=84.0.0",
    "wheel>=0.48.0",
]
build-backend = "setuptools.build_meta"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ughost",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "TECH",
    "PAPER",
]
